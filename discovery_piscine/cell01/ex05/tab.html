<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        td {
            padding: 70px 40px;
            font-family: sans-serif;
            font-size: 1.1em;
        }
        .cell-one {
            background-color:#98FB98;
        }
        .cell-two {
            background-color: #4E403B;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="cell-one">Mint</td>
            <td class="cell-two">Chocolate</td>
        </tr>
    </table>

</body>
</html>
