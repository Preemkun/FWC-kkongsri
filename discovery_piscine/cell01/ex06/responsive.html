<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        td {
            text-align: center;
            font-family: sans-serif;
            font-size: 1.2em;
        }
        .cell-one {
            background-color: #98FB98;
        }
        .cell-two {
            background-color: #4E403B;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="cell-one">Mint</td>
            <td class="cell-two">Chocolate</td>
        </tr>
    </table>
