<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basics</title>
    <style>
        body {
            background-color: pink;
        }
        h1 {
            color: white;
            text-align: center;
            font-size: 3.5em;
        }
        .shop-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 20px;
        }
        .shop-item {
            text-align: center;
        }
        .shop-item img {
            width: 200px;
            height: 150px;
            object-fit: contain;
        }
        .shop-item a {
            display: block;
            margin-top: 10px;
        }
        footer {
            text-align: right;
            font-style: italic;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <h1>Basics✨</h1>

    <div class="shop-container">
        <div class="shop-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Amazon">
            <a href="https://www.amazon.com">Amazon Store</a>
        </div>
        <div class="shop-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/EBay_logo.svg" alt="eBay">
            <a href="https://www.ebay.com">eBay Store</a>
        </div>
    </div>

    <hr>

    <footer>
        &copy; wil 2026
    </footer>

</body>
</html>
