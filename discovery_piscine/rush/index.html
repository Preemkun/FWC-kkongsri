<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> 42 Rush Team</title>
  
  <!-- index.css -->
  <link rel="stylesheet" href="index.css">
  
  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
</head>
<body>

  <!-- Top Navbar Header -->
  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="brand-group">
        <span class="badge-42">42</span>
        <span class="brand-title">Rush Team</span>
      </a>
    </div>
  </header>

  <!-- Hero Gradient Banner -->
  <section class="hero-banner">
    <h1 class="hero-title">Welcome to Rush Portfolio</h1>
  </section>

  <!-- Main Content: Team Profiles -->
  <main class="main-content">
    <h2 class="section-title">View team member profiles</h2>

    <div class="profiles-grid">
      
      <!-- Card: khusaini -->
      <div class="profile-card">
        <div class="avatar-wrapper">
          <img src="khusaini.jpg" alt="khusaini" class="avatar-img">
          </div>
          <h3 class="profile-name">khusaini</h3>
        <p class="profile-role">K-dai Student KMITL</p>
        <a href="CV-khusaini.html" class="btn-cv">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
          <span>View Khusaini's CV</span>
        </a>
      </div>

      <!-- Card: kkongsri -->
      <div class="profile-card">
        <div class="avatar-wrapper">
          <img src="kkongsri.jpg" alt="kkongsri" class="avatar-img">
          </div>
          <h3 class="profile-name">kkongsri</h3>
        <p class="profile-role">K-dai Student KMITL</p>
        <a href="CV-kkongsri.html" class="btn-cv">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
          <span>View kkongsri's CV</span>
        </a>
      </div>
    </div>
  </main>

  <!-- Footer Section -->
  <footer class="site-footer">
    <p class="footer-title">42 Bangkok - Piscine Discovery Rush</p>
  </footer>
</body>
</html>
